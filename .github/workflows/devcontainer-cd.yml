name: Deploy Dev Container Image to GitHub Packages

on:
  push:
    branches: ["main", "devcontainers-dev"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: "true"
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2 
        with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Dev Container image and push it if smoke build passes
        uses: devcontainers/ci@v0.3
        with:
            imageName: ghcr.io/oleg-nenashev/ros_gz_project_template-devcontainer
            cacheFrom: ghcr.io/oleg-nenashev/ros_gz_project_template-devcontainer
            push: always
            runCmd: |
              colcon build --cmake-args -DBUILD_TESTING=ON
